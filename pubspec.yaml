name: tabsnap
description: Split bills fairly — snap a receipt, assign items, done.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0

  # ── OCR ───────────────────────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ── State management ──────────────────────────────────────────────────────
  provider: ^6.1.2

  # ── UI helpers ────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  gap: ^3.0.1
  flutter_animate: ^4.5.0

  # ── Utils ─────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans_18pt-Bold.ttf
          weight: 700

    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces_72pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces_72pt-Black.ttf
          weight: 900